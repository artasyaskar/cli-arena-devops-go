name: CI Pipeline for cli-arena-devops-go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.21'
          cache: true # Explicitly enable Go module caching (default is true)

      - name: Set up Docker Compose (standalone)
        run: |
          # GitHub runners usually have Docker Engine. We need docker-compose (standalone v1 or a compatible v2 alias).
          # Installing a specific version of docker-compose standalone for compatibility with Makefile.
          # Using a more recent version of v1 series if available, or stick to a known working one.
          # Let's use the widely available 1.29.2 for now.
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          echo "Docker version:"
          docker --version
          echo "Docker Compose (standalone) version:"
          docker-compose --version

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0 # Specify a recent version

      - name: Cache Docker layers
        uses: satackey/action-docker-layer-caching@v0.0.11
        # Ignore errors from this step for now so it doesn't block the pipeline
        # if there are issues with caching on the runner.
        continue-on-error: true

      - name: Run Makefile setup
        run: make setup

      - name: Run Makefile lint
        run: make lint

      - name: Run Makefile test
        run: make test

      - name: Run Makefile build (Verify)
        run: make build
