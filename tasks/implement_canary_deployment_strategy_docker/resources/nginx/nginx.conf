events {
    worker_connections 1024;
}

http {
    # Upstream for the stable version (v1)
    upstream app_v1_backend {
        server app_v1:8081;
    }

    # Placeholder for canary upstream - to be configured by the user
    # upstream app_v2_backend {
    #     server app_v2:8082;
    # }

    # Placeholder for split_clients - to be configured by the user
    # split_clients "${arg_split_key}" $backend_choice {
    #     90%     app_v1_backend;  # 90% to v1
    #     10%     app_v2_backend;  # 10% to v2
    #     # The rest (if any due to hashing) could also go to v1 or a default
    # }

    server {
        listen 80;
        server_name localhost;

        location / {
            # Default to v1 if split_clients is not yet configured
            proxy_pass http://app_v1_backend;
            # User will modify this to use $backend_choice from split_clients
            # proxy_pass http://$backend_choice;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # This location might need to be smarter if /version is also subject to canary
        # For now, assume /version on v1 is fine, or user makes it also go through split logic
        location /version_v1_explicit { # for direct testing of v1
             proxy_pass http://app_v1_backend/version;
             proxy_set_header Host $host;
        }
        # User might add a /version_v2_explicit or make the main /version path also use split logic
    }
}
