version: '3.8'

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: go_vault_app
    ports:
      - "8080:8080" # Expose app port
    environment:
      # Initially, secrets are from env vars. User should make app ignore these if Vault provides them.
      - PORT=8080
      - DB_PASSWORD=initial_env_db_password
      - API_KEY=initial_env_api_key
      # VAULT_ADDR and VAULT_TOKEN will be added by the user for the app to connect to Vault
      # - VAULT_ADDR=http://vault:8200
      # - VAULT_TOKEN=roottoken
    networks:
      - vault_net



networks:
  vault_net:
    driver: bridge
